<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Predict AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  body { background:#111827; color:#e5e7eb; padding-bottom:30px; }
  .header { background:#1f2937; padding:16px; text-align:center; border-bottom:1px solid #374151; }
  .header h1 { font-size:1.3rem; color:#fff; }
  .header p { font-size:0.8rem; color:#9ca3af; margin-top:4px; }
  .container { max-width:500px; margin:0 auto; padding:12px; }

  .ad {
    background:#1e3a5f;
    border:1px solid #3b82f6;
    border-radius:8px;
    padding:12px;
    text-align:center;
    margin:14px 0;
  }
  .ad a { color:#60a5fa; font-weight:600; text-decoration:none; font-size:0.95rem; }

  .section { margin:20px 0 10px; font-size:1.05rem; font-weight:600; color:#f3f4f6; }

  .card {
    background:#1f2937;
    border-radius:10px;
    padding:14px;
    margin-bottom:10px;
    border:1px solid #374151;
  }
  .league { font-size:0.75rem; color:#9ca3af; margin-bottom:3px; }
  .teams { font-size:0.95rem; font-weight:600; margin-bottom:4px; }
  .time { font-size:0.8rem; color:#6b7280; margin-bottom:10px; }

  .markets {
    display:flex;
    gap:8px;
  }
  .market-box {
    flex:1;
    background:#111827;
    border-radius:7px;
    padding:8px;
    text-align:center;
  }
  .market-label { font-size:0.72rem; color:#9ca3af; }
  .market-value { font-size:0.9rem; font-weight:600; color:#34d399; margin-top:3px; }

  .ai-box {
    background:#1f2937;
    border-radius:10px;
    padding:16px;
    border:1px solid #374151;
  }
  .ai-box label { display:block; font-size:0.85rem; color:#9ca3af; margin:10px 0 4px; }
  .ai-box input, .ai-box select {
    width:100%;
    padding:11px;
    border-radius:7px;
    border:1px solid #374151;
    background:#111827;
    color:#fff;
    font-size:0.95rem;
  }
  .btn {
    width:100%;
    background:#2563eb;
    color:white;
    border:none;
    padding:13px;
    border-radius:8px;
    font-weight:600;
    font-size:1rem;
    margin-top:14px;
    cursor:pointer;
  }

  .tabs { display:flex; gap:8px; overflow-x:auto; margin:12px 0; }
  .tab {
    padding:7px 14px;
    background:#1f2937;
    border-radius:20px;
    font-size:0.82rem;
    white-space:nowrap;
    border:1px solid #374151;
  }
  .tab.active { background:#2563eb; border-color:#2563eb; }
</style>
</head>
<body>
  <div class="header">
    <h1>Smart Predict AI</h1>
    <p>Free Daily Predictions</p>
  </div>

  <div class="container">

    <div class="ad">
      <a href="https://asiafilm.org/4/bd80344d93bc26083f8b20a55302a626" target="_blank">Claim Free Bonus Now</a>
    </div>

    <div class="section">Best Ticket Today</div>
    <div id="bestTicket">Loading...</div>

    <div class="section">AI Odds Builder</div>
    <div class="ai-box">
      <label>Target Odds</label>
      <input type="number" id="targetOdds" value="5">

      <label>Number of Games</label>
      <select id="numGames">
        <option value="3">3 Games</option>
        <option value="4" selected>4 Games</option>
        <option value="5">5 Games</option>
        <option value="6">6 Games</option>
      </select>

      <label>Market Type</label>
      <select id="marketType">
        <option value="mixed">Mixed</option>
        <option value="over05">Team Over 0.5</option>
        <option value="handicap">Handicap</option>
        <option value="1x2">Straight Win</option>
      </select>

      <!-- Ad right before Generate button -->
      <div class="ad" style="margin:16px 0 8px;">
        <a href="//rm358.com/4/12185322?var=smartpredict&ymid=click" target="_blank">Get Instant Bonus Before Generating</a>
      </div>

      <button class="btn" onclick="buildTicket()">Generate Ticket</button>
    </div>

    <div id="aiResult" style="margin-top:16px;"></div>

    <div class="section">All Matches</div>
    <div class="tabs" id="leagueTabs"></div>
    <div id="allMatches">Loading matches...</div>

    <div class="ad">
      <a href="https://asiafilm.org/4/bd80344d93bc26083f8b20a55302a626" target="_blank">Exclusive Offer - Tap Here</a>
    </div>

  </div>

<script>
  let allData = [];
  let currentLeague = "All";

  function getRandomOdd(min, max) {
    return (Math.random() * (max - min) + min).toFixed(2);
  }

  function createMarket(match) {
    const options = [
      { label: "Over 0.5", value: getRandomOdd(1.25, 1.48), type: match.home + " Over 0.5" },
      { label: "Over 0.5", value: getRandomOdd(1.28, 1.50), type: match.away + " Over 0.5" },
      { label: "Under 2.5", value: getRandomOdd(1.45, 1.90), type: "Under 2.5" },
      { label: "Home 1:0", value: getRandomOdd(1.38, 1.75), type: "Handicap 1:0" },
      { label: "Away 0:1", value: getRandomOdd(1.38, 1.75), type: "Handicap 0:1" },
      { label: "Home", value: getRandomOdd(1.50, 2.20), type: "1X2" },
      { label: "Away", value: getRandomOdd(1.55, 2.30), type: "1X2" }
    ];
    return options[Math.floor(Math.random() * options.length)];
  }

  async function loadData() {
    try {
      const res = await fetch("matches.json?t=" + Date.now());
      const json = await res.json();
      allData = json.matches || json || [];
      showBest();
      showTabs();
      showMatches();
    } catch(e) {
      document.getElementById("bestTicket").innerHTML = "Failed to load. Refresh the page.";
    }
  }

  function showBest() {
    const box = document.getElementById("bestTicket");
    const list = allData.slice(0, 6);
    let html = "";
    list.forEach(function(m) {
      const mk = createMarket(m);
      html += `
        <div class="card">
          <div class="league">${m.league || ""} ${m.country ? "• " + m.country : ""}</div>
          <div class="teams">${m.home} vs ${m.away}</div>
          <div class="time">${m.time || "Upcoming"}</div>
          <div class="markets">
            <div class="market-box">
              <div class="market-label">${mk.type}</div>
              <div class="market-value">\( {mk.label} @ \){mk.value}</div>
            </div>
            <div class="market-box">
              <div class="market-label">Confidence</div>
              <div class="market-value">${70 + Math.floor(Math.random()*20)}%</div>
            </div>
          </div>
        </div>
      `;
    });
    box.innerHTML = html;
  }

  function showTabs() {
    const leagues = ["All"];
    allData.forEach(function(m) {
      if (m.league && leagues.indexOf(m.league) === -1) leagues.push(m.league);
    });
    let html = "";
    leagues.slice(0,8).forEach(function(l) {
      html += `<div class="tab \( {l===currentLeague?"active":""}" onclick="filterLeague(' \){l}')">${l}</div>`;
    });
    document.getElementById("leagueTabs").innerHTML = html;
  }

  function filterLeague(l) {
    currentLeague = l;
    showTabs();
    showMatches();
  }

  function showMatches() {
    const list = currentLeague === "All" ? allData : allData.filter(function(m){ return m.league === currentLeague; });
    const box = document.getElementById("allMatches");
    if (list.length === 0) {
      box.innerHTML = "No matches found";
      return;
    }
    let html = "";
    list.forEach(function(m) {
      const mk = createMarket(m);
      html += `
        <div class="card">
          <div class="league">${m.league || ""} ${m.country ? "• " + m.country : ""}</div>
          <div class="teams">${m.home} vs ${m.away}</div>
          <div class="time">${m.time || "Upcoming"}</div>
          <div class="markets">
            <div class="market-box">
              <div class="market-label">${mk.type}</div>
              <div class="market-value">\( {mk.label} @ \){mk.value}</div>
            </div>
            <div class="market-box">
              <div class="market-label">Confidence</div>
              <div class="market-value">${70 + Math.floor(Math.random()*20)}%</div>
            </div>
          </div>
        </div>
      `;
    });
    box.innerHTML = html;
  }

  function buildTicket() {
    const target = parseFloat(document.getElementById("targetOdds").value) || 5;
    const num = parseInt(document.getElementById("numGames").value) || 4;
    if (allData.length === 0) return alert("Matches not loaded");

    const selected = [];
    let total = 1;
    const shuffled = allData.slice().sort(function(){ return 0.5 - Math.random(); });

    for (let i=0; i<shuffled.length; i++) {
      if (selected.length >= num) break;
      const m = shuffled[i];
      const mk = createMarket(m);
      const odd = parseFloat(mk.value);
      if (total * odd <= target * 1.4) {
        selected.push({match: m, market: mk, odd: odd});
        total *= odd;
      }
    }

    let html = `<div class="section">Your Ticket • Total ${total.toFixed(2)}</div>`;
    selected.forEach(function(item) {
      html += `
        <div class="card">
          <div class="league">${item.match.league || ""}</div>
          <div class="teams">${item.match.home} vs ${item.match.away}</div>
          <div class="markets">
            <div class="market-box">
              <div class="market-label">${item.market.type}</div>
              <div class="market-value">\( {item.market.label} @ \){item.market.value}</div>
            </div>
            <div class="market-box">
              <div class="market-label">Odds</div>
              <div class="market-value">${item.market.value}</div>
            </div>
          </div>
        </div>
      `;
    });
    document.getElementById("aiResult").innerHTML = html;
  }

  loadData();
</script>
</body>
</html>
