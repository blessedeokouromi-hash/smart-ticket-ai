<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Smart Predict AI</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #22c55e;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --win: #14532d;
      --win-border: #22c55e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }
    .header { background: linear-gradient(135deg, #16a34a, #15803d); padding: 18px 16px; text-align: center; position: sticky; top: 0; z-index: 100; }
    .header h1 { font-size: 1.4rem; font-weight: 700; }
    .header p { font-size: 0.8rem; opacity: 0.9; margin-top: 4px; }
    .container { max-width: 520px; margin: 0 auto; padding: 12px; }
    .ad-box { background: #1e293b; border: 1px dashed #475569; border-radius: 10px; padding: 14px; margin: 14px 0; text-align: center; }
    .ad-box a { color: #38bdf8; font-size: 0.9rem; text-decoration: none; font-weight: 600; }
    .section-title { font-size: 1.05rem; font-weight: 700; margin: 20px 0 12px; display: flex; align-items: center; gap: 8px; }
    .ticket-card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); }
    .match-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 6px; }
    .score { font-size: 0.8rem; color: var(--muted); margin-bottom: 10px; }
    .pick-box { background: #14532d; border: 1px solid var(--win-border); border-radius: 8px; padding: 10px 12px; }
    .pick-line { font-size: 0.9rem; margin-bottom: 3px; }
    .pick-line strong { color: #4ade80; }
    .market { font-size: 0.8rem; color: #86efac; }
    .outcome { font-size: 0.8rem; color: #bbf7d0; }
    .tabs { display: flex; gap: 8px; margin: 16px 0; overflow-x: auto; }
    .tab { padding: 8px 14px; background: var(--card); border-radius: 20px; font-size: 0.85rem; white-space: nowrap; border: 1px solid var(--border); cursor: pointer; }
    .tab.active { background: var(--accent); color: #052e16; font-weight: 600; border-color: var(--accent); }
    .ai-box { background: var(--card); border-radius: 12px; padding: 16px; margin-top: 10px; border: 1px solid var(--border); }
    .ai-box input, .ai-box select { width: 100%; padding: 11px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: white; font-size: 0.95rem; }
    .btn { background: var(--accent); color: #052e16; border: none; padding: 12px; border-radius: 8px; font-weight: 700; width: 100%; font-size: 1rem; cursor: pointer; margin-top: 8px; }
    .btn:active { transform: scale(0.98); }
    .league { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .badge { display: inline-block; background: #22c55e; color: #052e16; font-size: 0.7rem; padding: 2px 7px; border-radius: 10px; font-weight: 700; margin-left: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Smart Predict AI</h1>
    <p>Free Daily Predictions • High Odds Markets</p>
  </div>

  <div class="container">
    <!-- Top Ad -->
    <div class="ad-box">
      <a href="https://asiafilm.org/4/bd80344d93bc26083f8b20a55302a626" target="_blank">🔥 Claim Free Bonus Now</a>
    </div>

    <div class="section-title">🔥 Best Ticket Today <span class="badge">FREE</span></div>
    <div id="bestTicket">
      <div class="loading">Loading today's best picks...</div>
    </div>

    <!-- Middle Ad -->
    <div class="ad-box">
      <a href="//rm358.com/4/12185322?var=smartpredict&ymid=click" target="_blank">⚡ Get Instant Cash Bonus</a>
    </div>

    <div class="section-title">🤖 AI Odds Builder</div>
    <div class="ai-box">
      <label>Target Total Odds</label>
      <input type="number" id="targetOdds" placeholder="e.g. 5.00" value="5">
      
      <label>Number of Games</label>
      <select id="numGames">
        <option value="3">3 Games</option>
        <option value="4" selected>4 Games</option>
        <option value="5">5 Games</option>
        <option value="6">6 Games</option>
      </select>

      <label>Preferred Market</label>
      <select id="marketType">
        <option value="mixed">Mixed (Best)</option>
        <option value="over05">Team Over 0.5</option>
        <option value="handicap">Asian Handicap</option>
        <option value="1x2">Straight Win</option>
        <option value="under25">Under 2.5</option>
      </select>

      <button class="btn" onclick="buildTicket()">Generate Ticket</button>
    </div>

    <div id="aiResult" style="margin-top:16px;"></div>

    <div class="section-title">📅 All Predictions</div>
    <div class="tabs" id="leagueTabs"></div>
    <div id="allMatches">
      <div class="loading">Loading matches...</div>
    </div>

    <!-- Bottom Ad -->
    <div class="ad-box">
      <a href="https://asiafilm.org/4/bd80344d93bc26083f8b20a55302a626" target="_blank">🎁 Exclusive Offer - Click Here</a>
    </div>
  </div>

  <script>
    let allData = [];
    let currentLeague = "All";

    // Load matches
    async function loadMatches() {
      try {
        const res = await fetch('matches.json?t=' + Date.now());
        const data = await res.json();
        allData = data.matches || [];
        renderBestTicket();
        renderLeagueTabs();
        renderMatches();
      } catch (e) {
        document.getElementById('bestTicket').innerHTML = '<div class="loading">Failed to load. Refresh the page.</div>';
      }
    }

    function getMarket(match) {
      // Generate realistic markets like the video
      const markets = [
        { pick: `Over 0.5 @\( {(1.25 + Math.random()*0.25).toFixed(2)}`, market: ` \){match.home} Over/Under`, outcome: "Over 0.5" },
        { pick: `Under 2.5 @\( {(1.45 + Math.random()*0.35).toFixed(2)}`, market: ` \){match.home} Over/Under`, outcome: "Under 2.5" },
        { pick: `Away (0:1) @${(1.35 + Math.random()*0.3).toFixed(2)}`, market: "Handicap 0:1", outcome: "Away (0:1)" },
        { pick: `Home (1:0) @${(1.40 + Math.random()*0.3).toFixed(2)}`, market: "Handicap 1:0", outcome: "Home (1:0)" },
        { pick: `Away @${(1.55 + Math.random()*0.4).toFixed(2)}`, market: "1X2", outcome: "Away" },
        { pick: `Home @${(1.50 + Math.random()*0.4).toFixed(2)}`, market: "1X2", outcome: "Home" },
        { pick: `Over 0.5 @\( {(1.28 + Math.random()*0.2).toFixed(2)}`, market: ` \){match.away} Over/Under`, outcome: "Over 0.5" },
      ];
      return markets[Math.floor(Math.random() * markets.length)];
    }

    function renderBestTicket() {
      const container = document.getElementById('bestTicket');
      if (!allData.length) return;

      // Take top 5 high confidence
      const picks = allData.slice(0, 8).map(m => {
        const mk = getMarket(m);
        return { ...m, ...mk };
      });

      container.innerHTML = picks.map(p => `
        <div class="ticket-card">
          <div class="league">${p.league || 'League'} • ${p.country || ''}</div>
          <div class="match-name">${p.home} vs ${p.away}</div>
          <div class="score">${p.time || 'Upcoming'}</div>
          <div class="pick-box">
            <div class="pick-line"><strong>Pick:</strong> ${p.pick}</div>
            <div class="market">Market: ${p.market}</div>
            <div class="outcome">Outcome: ${p.outcome}</div>
          </div>
        </div>
      `).join('');
    }

    function renderLeagueTabs() {
      const leagues = ["All", ...new Set(allData.map(m => m.league).filter(Boolean))];
      const tabs = document.getElementById('leagueTabs');
      tabs.innerHTML = leagues.slice(0, 8).map(l => 
        `<div class="tab \( {l === currentLeague ? 'active' : ''}" onclick="filterLeague(' \){l}')">${l}</div>`
      ).join('');
    }

    function filterLeague(league) {
      currentLeague = league;
      renderLeagueTabs();
      renderMatches();
    }

    function renderMatches() {
      const filtered = currentLeague === "All" ? allData : allData.filter(m => m.league === currentLeague);
      const container = document.getElementById('allMatches');
      
      container.innerHTML = filtered.slice(0, 40).map(m => {
        const mk = getMarket(m);
        return `
          <div class="ticket-card">
            <div class="league">${m.league || ''} • ${m.country || ''}</div>
            <div class="match-name">${m.home} vs ${m.away}</div>
            <div class="score">${m.time || 'Upcoming'}</div>
            <div class="pick-box">
              <div class="pick-line"><strong>Pick:</strong> ${mk.pick}</div>
              <div class="market">Market: ${mk.market}</div>
              <div class="outcome">Outcome: ${mk.outcome}</div>
            </div>
          </div>
        `;
      }).join('') || '<div class="loading">No matches found</div>';
    }

    function buildTicket() {
      const target = parseFloat(document.getElementById('targetOdds').value) || 5;
      const num = parseInt(document.getElementById('numGames').value) || 4;
      const type = document.getElementById('marketType').value;

      if (!allData.length) {
        alert("Matches not loaded yet");
        return;
      }

      // Simple selection
      const selected = [];
      let currentOdds = 1;
      const shuffled = [...allData].sort(() => Math.random() - 0.5);

      for (let m of shuffled) {
        if (selected.length >= num) break;
        const mk = getMarket(m);
        const odd = parseFloat(mk.pick.split('@')[1]);
        if (currentOdds * odd <= target * 1.4) {
          selected.push({ ...m, ...mk, odd });
          currentOdds *= odd;
        }
      }

      const result = document.getElementById('aiResult');
      result.innerHTML = `
        <div class="section-title">Your AI Ticket • Total ≈ ${currentOdds.toFixed(2)}</div>
        ${selected.map(p => `
          <div class="ticket-card">
            <div class="league">${p.league || ''}</div>
            <div class="match-name">${p.home} vs ${p.away}</div>
            <div class="pick-box">
              <div class="pick-line"><strong>Pick:</strong> ${p.pick}</div>
              <div class="market">Market: ${p.market}</div>
              <div class="outcome">Outcome: ${p.outcome}</div>
            </div>
          </div>
        `).join('')}
      `;
    }

    // Start
    loadMatches();
  </script>
</body>
</html>
