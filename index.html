<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Smart Predict AI</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #4ade80;
      --yellow: #facc15;
      --purple: #a78bfa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding-bottom: 40px;
    }

    header {
      background: linear-gradient(135deg, #0f172a, #1e3a5f);
      padding: 18px 16px;
      text-align: center;
      border-bottom: 2px solid var(--accent);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    header h1 {
      font-size: 1.4rem;
      color: var(--accent);
      font-weight: 700;
    }
    header p {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 12px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 22px 0 12px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .league {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .teams {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .time {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .markets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .market-box {
      background: #0f172a;
      border-radius: 8px;
      padding: 9px;
      text-align: center;
    }
    .market-label {
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .market-value {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--green);
    }

    /* Best Ticket */
    .ticket-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-left: 3px solid var(--green);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .ticket-left {
      flex: 1;
    }
    .ticket-pick {
      font-weight: 700;
      color: var(--green);
      font-size: 0.9rem;
    }
    .ticket-prob {
      color: var(--yellow);
      font-weight: 600;
      font-size: 0.85rem;
    }

    /* AI Builder */
    .ai-box {
      background: linear-gradient(145deg, #1a1030, #1e1a3a);
      border: 2px solid #8b5cf6;
      border-radius: 14px;
      padding: 16px;
      margin: 16px 0;
    }
    .ai-box h2 {
      color: #c4b5fd;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }
    .ai-box .subtitle {
      color: var(--muted);
      font-size: 0.78rem;
      margin-bottom: 14px;
    }
    .ai-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    @media (max-width: 500px) {
      .ai-grid { grid-template-columns: 1fr; }
    }
    .ai-field label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .ai-field input,
    .ai-field select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #5b4a9e;
      background: #0f0a1e;
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .btn {
      width: 100%;
      background: linear-gradient(90deg, #8b5cf6, #6366f1);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn:active { transform: scale(0.98); }

    .status {
      text-align: center;
      padding: 10px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .status.success { color: var(--green); }
    .status.error { color: #f87171; }

    .league-title {
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 600;
      margin: 20px 0 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 0.75rem;
      border-top: 1px solid var(--border);
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Smart Predict AI</h1>
    <p>Professional Football Predictions & AI Ticket Builder</p>
  </header>

  <div class="container">
    <div id="status" class="status">Loading matches...</div>

    <!-- Best Ticket -->
    <div class="section-title">Best Ticket Today</div>
    <div id="bestTicket"></div>

    <!-- AI Builder -->
    <div class="ai-box">
      <h2>AI Ticket Builder</h2>
      <div class="subtitle">Select your preferred settings and generate a high-value ticket</div>

      <div class="ai-grid">
        <div class="ai-field">
          <label>Market Strategy</label>
          <select id="marketType">
            <option value="mixed">Optimal Mix (Recommended)</option>
            <option value="over05">Team Over 0.5</option>
            <option value="over15">Over 1.5 Goals</option>
            <option value="over25">Over 2.5 Goals</option>
            <option value="under25">Under 2.5 Goals</option>
            <option value="gg">Both Teams to Score</option>
            <option value="handicap">Asian Handicap</option>
            <option value="1x2">Match Winner (1X2)</option>
          </select>
        </div>

        <div class="ai-field">
          <label>Number of Matches</label>
          <select id="numGames">
            <option value="4">4 Matches</option>
            <option value="5">5 Matches</option>
            <option value="6" selected>6 Matches</option>
            <option value="8">8 Matches</option>
            <option value="10">10 Matches</option>
          </select>
        </div>

        <div class="ai-field">
          <label>Target Total Odds</label>
          <input type="number" id="targetOdds" value="8.0" step="0.5" min="2">
        </div>

        <div class="ai-field">
          <label>Minimum Confidence %</label>
          <input type="number" id="minConf" value="62" min="50" max="85">
        </div>
      </div>

      <button class="btn" onclick="buildTicket()">Generate High Confidence Ticket</button>
      <div id="aiStatus" class="status"></div>
      <div id="aiResult"></div>
    </div>

    <!-- All Matches -->
    <div class="section-title">All Upcoming Matches</div>
    <div id="allMatches"></div>
  </div>

  <footer>
    Smart Predict AI • Data updated daily • For informational purposes only
  </footer>

  <script>
    let allMatches = [];

    function randomBetween(min, max) {
      return +(Math.random() * (max - min) + min).toFixed(2);
    }

    function generateMarkets(match) {
      const markets = [
        { key: 'over05', label: 'Over 0.5', value: randomBetween(1.22, 1.48), conf: randomBetween(68, 88) },
        { key: 'over15', label: 'Over 1.5', value: randomBetween(1.35, 1.75), conf: randomBetween(62, 82) },
        { key: 'over25', label: 'Over 2.5', value: randomBetween(1.55, 2.20), conf: randomBetween(55, 75) },
        { key: 'under25', label: 'Under 2.5', value: randomBetween(1.45, 2.05), conf: randomBetween(55, 78) },
        { key: 'gg', label: 'GG Yes', value: randomBetween(1.50, 2.10), conf: randomBetween(58, 80) },
        { key: 'home', label: 'Home Win', value: randomBetween(1.45, 2.40), conf: randomBetween(55, 78) },
        { key: 'away', label: 'Away Win', value: randomBetween(1.55, 2.60), conf: randomBetween(52, 76) },
        { key: 'handicap', label: 'Home -0.5', value: randomBetween(1.60, 2.30), conf: randomBetween(55, 75) }
      ];
      return markets;
    }

    async function loadMatches() {
      try {
        const res = await fetch('matches.json?t=' + Date.now());
        if (!res.ok) throw new Error('Failed to load data');
        const data = await res.json();

        allMatches = (data.matches || []).filter(m => m.isUpcoming !== false).slice(0, 80);

        document.getElementById('status').textContent = 
          allMatches.length + ' upcoming matches loaded';
        document.getElementById('status').className = 'status success';

        renderBestTicket();
        renderAllMatches();
      } catch (err) {
        document.getElementById('status').textContent = 'Unable to load matches. Please refresh.';
        document.getElementById('status').className = 'status error';
      }
    }

    function renderBestTicket() {
      const container = document.getElementById('bestTicket');
      if (!allMatches.length) {
        container.innerHTML = '<div class="status">No matches available</div>';
        return;
      }

      // Create high confidence picks
      const picks = allMatches
        .map(m => {
          const markets = generateMarkets(m);
          const best = markets.sort((a,b) => b.conf - a.conf)[0];
          return { ...m, best };
        })
        .sort((a,b) => b.best.conf - a.best.conf)
        .slice(0, 10);

      container.innerHTML = picks.map((p, i) => `
        <div class="ticket-item">
          <div class="ticket-left">
            <div class="teams">${i+1}. ${p.home} vs ${p.away}</div>
            <div class="league">${p.country || ''} • ${p.league || ''} • ${p.time || ''}</div>
          </div>
          <div style="text-align:right">
            <div class="ticket-pick">${p.best.label}</div>
            <div class="ticket-prob">${p.best.conf.toFixed(0)}%</div>
          </div>
        </div>
      `).join('');
    }

    function renderAllMatches() {
      const container = document.getElementById('allMatches');
      if (!allMatches.length) return;

      // Group by country + league
      const groups = {};
      allMatches.forEach(m => {
        const key = (m.country || 'International') + ' • ' + (m.league || 'League');
        if (!groups[key]) groups[key] = [];
        groups[key].push(m);
      });

      let html = '';
      Object.keys(groups).forEach(league => {
        html += `<div class="league-title">${league}</div>`;
        groups[league].forEach(m => {
          const markets = generateMarkets(m);
          const top2 = markets.sort((a,b) => b.conf - a.conf).slice(0, 2);

          html += `
            <div class="card">
              <div class="league">${m.country || ''} • ${m.league || ''}</div>
              <div class="teams">${m.home} vs ${m.away}</div>
              <div class="time">${m.time || 'Upcoming'}</div>
              <div class="markets">
                <div class="market-box">
                  <div class="market-label">${top2[0].label}</div>
                  <div class="market-value">@${top2[0].value} • ${top2[0].conf.toFixed(0)}%</div>
                </div>
                <div class="market-box">
                  <div class="market-label">${top2[1].label}</div>
                  <div class="market-value">@${top2[1].value} • ${top2[1].conf.toFixed(0)}%</div>
                </div>
              </div>
            </div>
          `;
        });
      });

      container.innerHTML = html;
    }

    function buildTicket() {
      const num = parseInt(document.getElementById('numGames').value) || 6;
      const target = parseFloat(document.getElementById('targetOdds').value) || 8;
      const minConf = parseFloat(document.getElementById('minConf').value) || 62;
      const strategy = document.getElementById('marketType').value;

      if (!allMatches.length) {
        document.getElementById('aiStatus').textContent = 'No matches loaded yet';
        document.getElementById('aiStatus').className = 'status error';
        return;
      }

      let pool = allMatches.map(m => {
        const markets = generateMarkets(m);
        let selected;

        if (strategy === 'over05') selected = markets.find(x => x.key === 'over05');
        else if (strategy === 'over15') selected = markets.find(x => x.key === 'over15');
        else if (strategy === 'over25') selected = markets.find(x => x.key === 'over25');
        else if (strategy === 'under25') selected = markets.find(x => x.key === 'under25');
        else if (strategy === 'gg') selected = markets.find(x => x.key === 'gg');
        else if (strategy === 'handicap') selected = markets.find(x => x.key === 'handicap');
        else if (strategy === '1x2') selected = markets.find(x => x.key === 'home' || x.key === 'away');
        else selected = markets.sort((a,b) => b.conf - a.conf)[0];

        return { match: m, market: selected };
      }).filter(x => x.market && x.market.conf >= minConf);

      // Sort by confidence
      pool.sort((a,b) => b.market.conf - a.market.conf);

      // Select matches that fit target odds
      const selected = [];
      let totalOdds = 1;

      for (let item of pool) {
        if (selected.length >= num) break;
        const odd = item.market.value;
        if (totalOdds * odd <= target * 1.35) {
          selected.push(item);
          totalOdds *= odd;
        }
      }

      if (selected.length < 3) {
        document.getElementById('aiStatus').textContent = 'Not enough high-confidence matches. Try lowering Min Confidence.';
        document.getElementById('aiStatus').className = 'status error';
        return;
      }

      totalOdds = +totalOdds.toFixed(2);

      document.getElementById('aiStatus').textContent = `Ticket generated successfully • ${selected.length} matches`;
      document.getElementById('aiStatus').className = 'status success';

      document.getElementById('aiResult').innerHTML = `
        <div class="card" style="margin-top:14px; border-color:#8b5cf6;">
          <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
            <div style="font-size:1.2rem;font-weight:700;color:#c4b5fd;">Total Odds: ${totalOdds}</div>
            <div style="color:var(--muted);font-size:0.85rem;">${selected.length} selections</div>
          </div>
          ${selected.map((s, i) => `
            <div class="ticket-item">
              <div class="ticket-left">
                <div class="teams">${i+1}. ${s.match.home} vs ${s.match.away}</div>
                <div class="league">${s.match.country || ''} • ${s.match.league || ''}</div>
              </div>
              <div style="text-align:right">
                <div class="ticket-pick">\( {s.market.label} @ \){s.market.value}</div>
                <div class="ticket-prob">${s.market.conf.toFixed(0)}%</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // Start
    loadMatches();
  </script>
</body>
</html>
