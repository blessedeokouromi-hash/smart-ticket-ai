name: Update Matches Daily

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch today's fixtures
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          python3 << 'EOF'
          import requests, json, os
          from datetime import datetime, timezone

          API_KEY = os.environ["API_KEY"]
          headers = {"x-apisports-key": API_KEY}

          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          print(f"Fetching fixtures for: {today}")

          url = f"https://v3.football.api-sports.io/fixtures?date={today}"
          response = requests.get(url, headers=headers, timeout=30)
          data = response.json()

          matches = []
          if data.get("response"):
              for item in data["response"]:
                  fixture = item["fixture"]
                  teams = item["teams"]
                  league = item["league"]
                  goals = item.get("goals", {})

                  timestamp = fixture["timestamp"]
                  kickoff = datetime.fromtimestamp(timestamp, tz=timezone.utc)

                  match = {
                      "id": fixture["id"],
                      "date": today,
                      "time": kickoff.strftime("%H:%M"),
                      "timestamp": timestamp,
                      "home": teams["home"]["name"],
                      "away": teams["away"]["name"],
                      "country": league.get("country", ""),
                      "league": league.get("name", ""),
                      "league_id": league.get("id"),
                      "status": fixture["status"]["short"],
                      "isUpcoming": fixture["status"]["short"] in ["NS", "TBD", "PST"],
                      "score": {
                          "home": goals.get("home"),
                          "away": goals.get("away")
                      }
                  }
                  matches.append(match)

          matches.sort(key=lambda x: x["timestamp"])

          output = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "date": today,
              "total": len(matches),
              "matches": matches
          }

          with open("matches.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, ensure_ascii=False)

          print(f"Saved {len(matches)} matches for {today}")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add matches.json
          git diff --staged --quiet || git commit -m "Update matches for $(date +%Y-%m-%d)"
          git push
